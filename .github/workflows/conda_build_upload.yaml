name: Conda build & upload (multi-OS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      label:
        description: "Anaconda label (dev/main)"
        required: true
        default: "main"

jobs:
  build-and-upload:
    name: Build & Upload (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            subdir: linux-64
            arch: x64
          - os: macos-14
            subdir: osx-arm64
            arch: arm64
          - os: macos-14
            subdir: osx-64
            arch: x64

    env:
      RECIPE_DIR: conda-recipe
      LABEL: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'main' || github.event.inputs.label }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniforge (conda + mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge,bioconda,defaults
          channel-priority: strict
          auto-update-conda: true
          architecture: ${{ matrix.arch }}

      - name: Show conda info
        shell: bash -l {0}
        run: |
          conda info
          conda config --show
          ls -la "$RECIPE_DIR"

      - name: Install build tools
        shell: bash -l {0}
        run: |
          # install into the prefix of the conda actually on PATH, then make its
          # bin directory authoritative so the probe below sees what we installed
          CONDA_BASE=$(conda info --base)
          mamba install -y -p "$CONDA_BASE" -c conda-forge "conda-build>=26" anaconda-client anaconda-cli-base
          "$CONDA_BASE/bin/anaconda" --help >/dev/null
          export PATH="$CONDA_BASE/bin:$PATH"
          # conda 26 does not reliably register the "build" subcommand and the
          # standalone conda-build executable is not always shipped, so probe
          # which invocation works and reuse it in the next steps.
          if conda build --version >/dev/null 2>&1; then
            CB="conda build"
          elif python -m conda build --version >/dev/null 2>&1; then
            CB="python -m conda build"
          elif command -v conda-build >/dev/null 2>&1; then
            CB="conda-build"
          else
            echo "No working conda build invocation found" >&2
            conda info >&2
            exit 1
          fi
          echo "CONDA_BUILD_CMD=$CB" >> "$GITHUB_ENV"
          echo "Using: $CB"

      - name: Compute output path
        id: out
        shell: bash -l {0}
        run: |
          PKG_PATH=$($CONDA_BUILD_CMD "$RECIPE_DIR" -c conda-forge -c bioconda --output)
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "Will build: $PKG_PATH"

      - name: Build recipe
        shell: bash -l {0}
        run: |
          $CONDA_BUILD_CMD "$RECIPE_DIR" -c conda-forge -c bioconda

      - name: Upload to Anaconda (elsab-lab)
        if: env.ANACONDA_API_TOKEN != ''
        shell: bash -l {0}
        run: |
          PKG="${{ steps.out.outputs.pkg_path }}"
          echo "Uploading $PKG with label: $LABEL"
          "$(conda info --base)/bin/anaconda" -t "$ANACONDA_API_TOKEN" upload -u elsab-lab -l "$LABEL" --skip-existing "$PKG"

      - name: Test user install from channel
        shell: bash -l {0}
        run: |
          mamba create -n frag-test -y
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate frag-test
          mamba install -y -c elsab-lab -c conda-forge -c bioconda r-fragmentomics
          R -q -e "library(fRagmentomics); packageVersion('fRagmentomics')"
